<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- פרטיות: הדפדפן חוסם כל פנייה לכתובת שאינה האתר עצמו -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f4e79">
  <title>חיפוש שיירות</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>חיפוש שיירות</h1>
    <p class="sub">הכל נשמר רק בטלפון ונמחק בסוף היום</p>
  </header>

  <main>
    <section class="card">
      <label for="search" class="label">מספר שיירה</label>
      <input id="search" type="search" inputmode="numeric" autocomplete="off"
             placeholder="הקלד מספר (לפחות 3 ספרות)" maxlength="6">
      <div id="results"></div>
    </section>

    <section class="card">
      <label class="upload-btn" for="file">📷 העלאת תמונות של טבלה</label>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <div id="status" class="status" aria-live="polite"></div>
      <div id="report"></div>
    </section>

    <section class="card small">
      <div id="summary"></div>
      <button id="clear" class="danger" type="button">מחיקת כל הנתונים עכשיו</button>
    </section>
  </main>

  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar">
      <button type="button" data-act="close">✕ סגירה</button>
      <button type="button" data-act="out">−</button>
      <button type="button" data-act="in">+</button>
      <button type="button" data-act="ctx">הצג שורות סמוכות</button>
    </div>
    <div class="viewer-body"><canvas id="viewer-canvas"></canvas></div>
    <div id="viewer-caption" class="viewer-caption"></div>
  </div>

  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="db.js"></script>
  <script src="ocr.js"></script>
  <script src="app.js"></script>
</body>
</html>
